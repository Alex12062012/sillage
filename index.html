<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#9ec5e8" />
    <meta name="description" content="Sillage — a low-poly skiing game about speed and the joy of carving. Play in your browser." />
    <title>Sillage</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2380b4e0'/%3E%3Cpath d='M10 50 L32 14 L54 50 Z' fill='%23f4f7fb'/%3E%3Cpath d='M20 54 C30 40 34 40 44 26' stroke='%23ff7a3d' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="loading">
      <div class="ld-logo">SILLAGE</div>
      <div class="ld-bar"><i></i></div>
      <p>Waxing the skis…</p>
    </div>
    <style>
      #loading { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(#5f93d3, #f3d8c6); color: #fff; font: 700 14px ui-rounded, system-ui, sans-serif; transition: opacity 0.5s; }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .ld-logo { font-size: 54px; font-weight: 900; letter-spacing: 10px; text-shadow: 0 4px 24px rgba(20, 40, 70, 0.3); }
      #loading .ld-bar { width: 160px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.35); overflow: hidden; margin: 18px 0 10px; }
      #loading .ld-bar i { display: block; width: 40%; height: 100%; background: #fff; animation: ld 1.1s ease-in-out infinite; }
      #loading p { margin: 0; opacity: 0.85; }
      @keyframes ld { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    </style>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
